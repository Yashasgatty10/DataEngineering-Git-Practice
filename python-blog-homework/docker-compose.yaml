services:
  postgres:
    image: postgres:14
    container_name: python_blog_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: python_blogs
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  scraper:
    build: .
    container_name: python_blog_scraper
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: python_blogs
      DB_USER: postgres
      DB_PASSWORD: postgres

volumes:
  postgres_data:
