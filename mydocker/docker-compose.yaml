services:
  python_service:
    build:
      context: ./
      dockerfile: Dockerfile
    image: workshop1
    container_name: workshop_python_container
    stdin_open: true
    tty: true
    dns:
      - 192.168.137.1
    volumes:
      - .:/app

  psql-db:
    image: postgres:14
    container_name: psql-db
    environment:
      - PGPASSWORD=123456
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - "5434:5432"

